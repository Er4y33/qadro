# Her push ve pull request'te kodun kalitesini otomatik kontrol eder:
# lint (kod stili), test (oyun kuralları ve veritabanı senaryoları), build (derleme).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tip kontrolü
        run: npx tsc --noEmit
      - name: Testler
        run: npm test
      - name: Build
        run: npm run build
